<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>rhythm summary</title>
    <link rel="stylesheet" href="../shared.css">
  </head>
  <body>
    <main class="bigscreen jp">
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:12px">
        <div class="bgm-chip">おんがく あり
          <span class="rhythm-bars">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </span>
        </div>
      </div>
      <h1>4せっと まとめ</h1>
      
      <div class="flow-progress"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></div>
      <div class="pair-summary-grid">
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/long_jp.png" alt="ながい">
        <span>ながい</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/short_jp.png" alt="みじかい">
        <span>みじかい</span>
      </div>
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/clean_jp.png" alt="きれい">
        <span>きれい</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/dirty_jp.png" alt="きたない">
        <span>きたない</span>
      </div>
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/bright_jp.png" alt="あかるい">
        <span>あかるい</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/dark_jp.png" alt="くらい">
        <span>くらい</span>
      </div>
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/stand_up_jp.png" alt="たつ">
        <span>たつ</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/sit_down_jp.png" alt="すわる">
        <span>すわる</span>
      </div></div>
  
    </main>
  </body>
</html>
