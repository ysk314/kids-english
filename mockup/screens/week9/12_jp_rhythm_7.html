<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>jp_rhythm_7</title>
    <link rel="stylesheet" href="../../shared.css">
    <style>
      .week9-sentence-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        justify-items: center;
      }
      .week9-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        padding: 14px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.88);
        border: 4px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 10px 22px rgba(71, 18, 45, 0.12);
        width: min(760px, 100%);
      }
      .week9-img-shell {
        position: relative;
        width: 100%;
        height: clamp(240px, 36vh, 360px);
        border-radius: 22px;
        overflow: hidden;
        background: linear-gradient(135deg, #fff9ef, #ffe8f3);
        border: 3px solid rgba(244, 227, 199, 0.9);
      }
      .week9-img-shell img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform: translateY(var(--img-offset-y, 0%)) scale(var(--img-scale, 1));
        transform-origin: center center;
      }
      .week9-img-shell.missing img {
        display: none;
      }
      .week9-img-fallback {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        padding: 16px;
        text-align: center;
        font-family: "Yusei Magic", sans-serif;
        font-size: clamp(26px, 3vw, 40px);
        color: #4b3651;
        background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.95), rgba(255,235,246,0.92));
      }
      .week9-img-shell.missing .week9-img-fallback {
        display: grid;
      }
      .week9-card .sentence {
        font-size: clamp(25px, 3vw, 40px);
        font-weight: 800;
        line-height: 1.3;
        text-align: center;
        word-break: keep-all;
        overflow-wrap: normal;
      }
      .week9-sentence-line {
        display: flex;
        flex-wrap: wrap;
        gap: 0.24em;
        align-items: center;
      }
      .week9-sentence-token {
        display: inline-block;
        white-space: nowrap;
      }
      .week9-theme-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        width: min(1120px, 100%);
        margin: 0 auto;
      }
      .week9-theme-item {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.9);
        border: 3px solid rgba(255, 255, 255, 0.92);
      }
      .week9-theme-item .week9-img-shell {
        height: clamp(180px, 24vh, 250px);
      }
      .week9-theme-banner {
        padding: 18px 22px;
        border-radius: 26px;
        background: linear-gradient(135deg, #fff9ef, #ffe8f3);
        border: 4px solid rgba(255, 255, 255, 0.92);
        text-align: center;
      }
      .week9-theme-banner strong {
        display: block;
        font-size: clamp(28px, 3.4vw, 42px);
        font-family: "Yusei Magic", sans-serif;
      }
      .week9-theme-banner p {
        margin: 10px 0 0;
        font-size: clamp(20px, 2.6vw, 30px);
        font-weight: 800;
        word-break: keep-all;
        overflow-wrap: normal;
      }
      .week9-work-board {
        display: grid;
        gap: 16px;
        width: min(1240px, 100%);
        margin: 0 auto;
      }
      .week9-rhythm-row {
        width: min(1180px, 100%);
        display: grid;
        grid-template-columns: minmax(320px, 0.92fr) minmax(420px, 1.08fr);
        gap: 22px;
        align-items: stretch;
        margin-inline: auto;
      }
      .week9-rhythm-visual,
      .week9-rhythm-copy {
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.92);
        border: 4px solid rgba(255, 255, 255, 0.96);
        box-shadow: 0 10px 22px rgba(71, 18, 45, 0.12);
      }
      .week9-rhythm-visual {
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .week9-rhythm-visual .week9-img-shell {
        width: 100%;
        height: clamp(340px, 54vh, 560px);
      }
      .week9-rhythm-copy {
        padding: 28px 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .week9-rhythm-copy .sentence {
        font-size: clamp(42px, 5.4vw, 74px);
        line-height: 1.22;
        justify-content: flex-start;
        word-break: keep-all;
        overflow-wrap: normal;
      }
      .week9-work-slots {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .week9-slot {
        border-radius: 24px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.92);
        border: 4px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 8px 20px rgba(71, 18, 45, 0.12);
      }
      .week9-slot-label {
        font-size: 20px;
        font-weight: 800;
        color: #80506c;
      }
      .week9-slot-value {
        margin-top: 10px;
        min-height: 82px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #fff9ef, #ffe8f3);
        border: 3px dashed #ef9cc4;
        font-size: clamp(28px, 3.2vw, 42px);
        font-weight: 800;
        text-align: center;
        padding: 12px;
        word-break: keep-all;
        overflow-wrap: normal;
      }
      .week9-slot.is-live .week9-slot-value {
        animation: card-bob 620ms ease-in-out infinite;
        border-style: solid;
        border-color: #ff4f7d;
      }
      .week9-status {
        text-align: center;
        font-size: clamp(20px, 2.6vw, 30px);
        font-weight: 800;
        color: #5f3657;
        word-break: keep-all;
        overflow-wrap: normal;
      }
      .week9-result-card {
        display: grid;
        grid-template-columns: minmax(320px, 0.92fr) minmax(420px, 1.08fr);
        gap: 22px;
        align-items: stretch;
        margin-inline: auto;
      }
      .week9-result-card.is-hidden {
        display: none;
      }
      .week9-result-image,
      .week9-result-copy {
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.92);
        border: 4px solid rgba(255, 255, 255, 0.96);
        box-shadow: 0 10px 22px rgba(71, 18, 45, 0.12);
      }
      .week9-result-image {
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .week9-result-copy {
        padding: 28px 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .week9-result-copy .label {
        font-size: 20px;
        font-weight: 800;
        color: #80506c;
      }
      .week9-result-copy .sentence {
        font-size: clamp(42px, 5.4vw, 74px);
        line-height: 1.22;
        justify-content: flex-start;
        word-break: keep-all;
        overflow-wrap: normal;
      }
      .week9-result-image .week9-img-shell {
        width: 100%;
        height: clamp(340px, 54vh, 560px);
      }
      .week9-work-actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: end;
      }
      .week9-work-action-row {
        display: flex;
        gap: 14px;
      }
      .week9-work-btn {
        min-width: 160px;
        border: none;
        border-radius: 999px;
        padding: 16px 28px;
        font-family: "Yusei Magic", sans-serif;
        font-size: clamp(24px, 2.8vw, 34px);
        font-weight: 800;
        color: #ffffff;
        box-shadow: 0 10px 22px rgba(71, 18, 45, 0.18);
        pointer-events: none;
      }
      .week9-work-btn-start {
        background: linear-gradient(135deg, #24b16f, #4fd884);
      }
      .week9-work-btn-stop {
        background: linear-gradient(135deg, #e95555, #ff8b62);
      }
      .week9-work-btn-reset {
        background: linear-gradient(135deg, #4b6cff, #7aa8ff);
      }
      .week9-work-btn.is-disabled {
        opacity: 0.4;
        filter: saturate(0.7);
      }
      .week9-work-btn.is-hidden {
        visibility: hidden;
      }
      @media (max-width: 980px) {
        .week9-theme-grid,
        .week9-work-slots,
        .week9-sentence-grid {
          grid-template-columns: 1fr;
        }
        .week9-rhythm-row {
          grid-template-columns: 1fr;
        }
        .week9-result-card {
          grid-template-columns: 1fr;
        }
        .week9-rhythm-copy .sentence,
        .week9-result-copy .sentence {
          justify-content: center;
        }
        .week9-work-actions {
          grid-template-columns: 1fr;
        }
        .week9-work-action-row {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="bigscreen jp">
      <h1>リズムで ぶんを いおう！</h1>
      <section class="slide-body body-rhythm">
    <div class="flow-progress"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></div>
    <div class="week9-rhythm-row">
      <section class="week9-rhythm-visual">
        
    <div class="week9-img-shell" style="--img-scale:1.16;--img-offset-y:0%">
      <img src="../../assets/week9/mutsumi-sensei.png" alt="むつみ先生" onerror="this.hidden=true;this.parentElement.classList.add('missing')">
      <div class="week9-img-fallback">むつみ先生</div>
    </div>
  
      </section>
      <section class="week9-rhythm-copy">
        <div class="sentence week9-sentence-line"><span class="week9-sentence-token">むつみ先生は</span><span class="week9-sentence-token">えいごの</span><span class="week9-sentence-token">せんせいです。</span></div>
      </section>
    </div>
  </section>
    </main>
  </body>
</html>
