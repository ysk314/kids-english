<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>rhythm summary</title>
    <link rel="stylesheet" href="../shared.css">
  </head>
  <body>
    <main class="bigscreen en">
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:12px">
        <div class="bgm-chip">BGM ON
          <span class="rhythm-bars">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </span>
        </div>
      </div>
      <h1>All 4 Rhythm Pairs</h1>
      
      <div class="flow-progress"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></div>
      <div class="pair-summary-grid">
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/long_en.png" alt="long">
        <span>long</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/short_en.png" alt="short">
        <span>short</span>
      </div>
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/clean_en.png" alt="clean">
        <span>clean</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/dirty_en.png" alt="dirty">
        <span>dirty</span>
      </div>
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/bright_en.png" alt="bright">
        <span>bright</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/dark_en.png" alt="dark">
        <span>dark</span>
      </div>
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/stand_up_en.png" alt="stand up">
        <span>stand up</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/sit_down_en.png" alt="sit down">
        <span>sit down</span>
      </div></div>
  
    </main>
  </body>
</html>
