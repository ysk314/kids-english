<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>rhythm summary</title>
    <link rel="stylesheet" href="../shared.css">
  </head>
  <body>
    <main class="bigscreen en">
      <h1>All 4 Rhythm Pairs</h1>
      <section class="slide-body body-rhythm-summary">
      <div class="flow-progress"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></div>
      <div class="pair-summary-grid">
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/long_jp.png" alt="long">
        <span>long</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/short_jp.png" alt="short">
        <span>short</span>
      </div>
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/clean_jp.png" alt="clean">
        <span>clean</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/dirty_jp.png" alt="dirty">
        <span>dirty</span>
      </div>
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/bright_jp.png" alt="bright">
        <span>bright</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/dark_jp.png" alt="dark">
        <span>dark</span>
      </div>
      <div class="pair-summary-item">
        <img src="../assets/oppositions_cards/stand_up_jp.png" alt="stand up">
        <span>stand up</span>
        <b>↔</b>
        <img src="../assets/oppositions_cards/sit_down_jp.png" alt="sit down">
        <span>sit down</span>
      </div></div>
  </section>
    </main>
  </body>
</html>
