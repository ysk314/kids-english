<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>rhythm 2</title>
    <link rel="stylesheet" href="../shared.css">
  </head>
  <body>
    <main class="bigscreen en">
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:12px">
        <div class="bgm-chip">BGM ON
          <span class="rhythm-bars">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </span>
        </div>
      </div>
      <h1>clean / dirty</h1>
      
      <div class="flow-progress"><span class="on"></span><span class="on"></span><span class=""></span><span class=""></span></div>
      <div class="focus-pair compact">
        <div class="focus-card compact">
          <img src="../assets/oppositions_cards/clean_en.png" alt="clean">
          <div class="label">clean</div>
        </div>
        <div class="connector">↔</div>
        <div class="focus-card compact">
          <img src="../assets/oppositions_cards/dirty_en.png" alt="dirty">
          <div class="label">dirty</div>
        </div>
      </div>
  
    </main>
  </body>
</html>
