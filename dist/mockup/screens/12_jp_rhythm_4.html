<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>rhythm 4</title>
    <link rel="stylesheet" href="../shared.css">
  </head>
  <body>
    <main class="bigscreen jp">
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:12px">
        <div class="bgm-chip">おんがく あり
          <span class="rhythm-bars">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </span>
        </div>
      </div>
      <h1>たつ / すわる</h1>
      
      <div class="flow-progress"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></div>
      <div class="focus-pair compact">
        <div class="focus-card compact">
          <img src="../assets/oppositions_cards/stand_up_jp.png" alt="たつ">
          <div class="label">たつ</div>
        </div>
        <div class="connector">↔</div>
        <div class="focus-card compact">
          <img src="../assets/oppositions_cards/sit_down_jp.png" alt="すわる">
          <div class="label">すわる</div>
        </div>
      </div>
  
    </main>
  </body>
</html>
