<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>大画面表示（第9週）</title>
    <script type="module" crossorigin src="../assets/week9Bigscreen-DY1_W08K.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/sessionBus-BwRge9Ne.js">
    <link rel="modulepreload" crossorigin href="../assets/lessonData-B4XCDqlM.js">
    <link rel="stylesheet" crossorigin href="../assets/sessionBus-D1IxQHln.css">
  </head>
  <body>
    <main class="bigscreen-shell">
      <header class="bigscreen-header">
        <div class="left">
          <div class="logo-box">塾</div>
          <span>第9週 大画面</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button type="button" class="bigscreen-chip fullscreen-btn" data-testid="fullscreen-btn">全画面</button>
          <button type="button" class="bigscreen-chip bigscreen-reconnect-btn" data-testid="bigscreen-reconnect-btn">再接続</button>
          <span class="bigscreen-chip bigscreen-sync-chip" data-testid="bigscreen-sync-chip">接続診断: 初期化中</span>
          <span class="bigscreen-chip" data-testid="bigscreen-points">みんな 0 / むつみ先生 0</span>
          <span class="bigscreen-chip" data-testid="bigscreen-status">Mirror Waiting</span>
          <span class="bigscreen-chip" data-testid="bigscreen-count">1 / 21</span>
        </div>
      </header>
      <iframe
        data-testid="bigscreen-frame"
        class="bigscreen-stage"
        title="ミラー表示"
        src="../mockup/screens/week9/11_theme_title.html"
      ></iframe>
      <div class="bigscreen-point-fx" data-testid="bigscreen-point-fx" aria-hidden="true">
        <div class="bigscreen-point-fx-label" data-testid="bigscreen-point-fx-label">+1</div>
      </div>
      <div class="bigscreen-end-fx" data-testid="bigscreen-end-fx" aria-hidden="true">
        <div class="bigscreen-end-fx-label" data-testid="bigscreen-end-fx-label">けっか はっぴょう！</div>
      </div>
    </main>
  </body>
</html>
